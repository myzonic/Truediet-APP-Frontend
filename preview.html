<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrueDiet Preview</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef3f0;font-family:"DM Sans",Arial,sans-serif;color:#2c3e50}.phone{width:min(100vw,412px);height:min(100vh,915px);min-height:760px;position:relative;overflow:hidden;background:#fff;box-shadow:0 18px 50px #054b7030}.app{height:100%;display:flex;flex-direction:column;padding:15px 24px 24px}.figma-welcome{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}.figma-cta{position:absolute;left:5.78%;top:65.66%;width:87.71%;height:6.12%;border:0;border-radius:14px;background:transparent;cursor:pointer;transition:.15s}.figma-cta:hover{background:#ffffff24}.figma-cta:active{transform:scale(.985)}.header{height:38px;display:flex;justify-content:space-between;align-items:center}.logo{font:700 19px Georgia,serif;color:#054b70}.leaf{color:#64a826}.back{width:34px;border:0;background:transparent;color:#054b70;font-size:20px;cursor:pointer}.progress{margin:10px 0 5px}.progress-copy{display:flex;justify-content:space-between;font-size:10px;color:#64a826;font-weight:800;letter-spacing:1px}.track{height:7px;margin-top:7px;border-radius:20px;background:#e4eee1;overflow:hidden}.fill{height:100%;border-radius:20px;background:linear-gradient(90deg,#64a826,#8dc63f,#f7931e)}.screen{flex:1;display:flex;flex-direction:column}.center{text-align:center;align-items:center}.eyebrow{margin-top:23px;color:#f7931e;font-size:10px;font-weight:800;letter-spacing:1.25px}.title{margin:8px 0 0;font:700 32px/38px Georgia,serif;color:#054b70;letter-spacing:-.8px;white-space:pre-line}.body{margin:11px 0 0;color:#667985;font-size:14px;line-height:21px}.bottom{margin-top:auto}.trust{text-align:center;color:#64a826;font-size:11px;font-weight:700;margin-bottom:12px}.btn{min-height:56px;width:100%;border:0;border-radius:14px;background:#054b70;color:#fff;font-weight:800;letter-spacing:1px;cursor:pointer;transition:.15s}.btn:hover{background:#09648f}.btn:active{transform:scale(.985)}.list{display:grid;gap:10px;margin-top:24px}.option{min-height:62px;width:100%;padding:10px 13px;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid #dce8d8;border-radius:14px;background:#fff;font:700 14px Arial;color:#2c3e50;cursor:pointer}.option:hover,.option.selected{border-color:#64a826;background:#f6fbf1}.option .ico{width:37px;height:37px;display:grid;place-items:center;border-radius:12px;background:#ecf3e9;color:#054b70;font-size:19px}.option.selected .ico{background:#64a826;color:#fff}.radio{margin-left:auto;width:20px;height:20px;border:2px solid #b7c7b0;border-radius:50%}.selected .radio{border:6px solid #64a826}.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:24px}.chip{border:1px solid #dce8d8;border-radius:99px;padding:10px 12px;background:#fff;color:#2c3e50;font-size:12px;font-weight:700;cursor:pointer}.chip.selected{background:#64a826;color:#fff;border-color:#64a826}.seg{display:flex;margin-top:22px;padding:4px;border-radius:12px;background:#eef4ea}.seg button{flex:1;padding:11px;border:0;border-radius:9px;background:transparent;color:#667985;font-weight:700;cursor:pointer}.seg button.selected{background:#fff;color:#054b70}.fields{display:flex;gap:12px;margin-top:14px}.field{flex:1}.field label{display:block;margin-bottom:7px;font-size:12px;font-weight:700}.field input{width:100%;height:51px;padding:0 12px;border:1px solid #dce8d8;border-radius:12px;font-size:15px}.help{color:#667985;font-size:12px;line-height:18px}.build{justify-content:center}.buildicon{width:94px;height:94px;display:grid;place-items:center;border-radius:30px;background:linear-gradient(135deg,#64a826,#f7931e);font-size:42px}.spinner{margin:25px 0 4px;color:#64a826;font-size:24px}.summary{margin-top:13px;padding:14px;display:flex;gap:12px;border:1px solid #dce8d8;border-radius:14px}.summary i{font-style:normal;color:#64a826;font-size:20px}.summary small,.rec-title{color:#667985;font-size:11px;font-weight:700}.summary b{display:block;margin-top:3px;font-size:13px}.recommend{margin-top:24px;font:700 20px Georgia,serif;color:#054b70}.rec{margin-top:9px;padding:14px;display:flex;gap:11px;align-items:center;border-radius:13px;background:#f5f9f1;font-size:13px;font-weight:700}.notice{margin-top:16px;padding:13px;border-radius:13px;background:#e8f2f5;color:#054b70;font-size:11px;line-height:16px}.hidden{display:none}
</style></head><body><main class="phone"><div id="app" class="app"></div></main><script>
const A={screen:1,goal:'Understand Nutrition Better',allergies:['None'],prefs:['No specific preference'],unit:'Metric'};const goals=[['Eat Healthier','🍎'],['Manage My Weight','⚖'],['Improve Energy','⚡'],['Manage a Health Condition','♥'],['Understand Nutrition Better','▤'],['Improve Fitness & Performance','↗']];const allergies=['None','Dairy','Gluten/Wheat','Peanuts','Tree Nuts','Eggs','Soy','Fish','Shellfish','Sesame','Other'];const prefs=['No specific preference','Vegetarian','Vegan','Pescatarian','Mediterranean','Plant-forward','Low-carb','High-protein','Gluten-free','Dairy-free','Halal','Kosher','Other'];
const app=document.querySelector('#app');const header=(step=0)=>`<div class="header"><button class="back" onclick="go(${A.screen-1})">${A.screen>1&&A.screen<7?'←':''}</button><div class="logo"><span class="leaf">♧</span> TrueDiet</div><div class="back"></div></div>${step?`<div class="progress"><div class="progress-copy"><span>ASSESSMENT · STEP ${step}/4</span><span>${step*25}%</span></div><div class="track"><div class="fill" style="width:${step*25}%"></div></div></div>`:''}`;const heading=(e,t,b)=>`<div class="eyebrow">${e}</div><h1 class="title">${t}</h1>${b?`<p class="body">${b}</p>`:''}`;const button=(label,fn)=>`<div class="bottom"><div class="trust">♧ Customized by Registered Dietitians</div><button class="btn" onclick="${fn}">${label}</button></div>`;
function toggle(key,item,def){if(item===def)A[key]=[item];else{A[key]=A[key].filter(x=>x!==def);A[key].includes(item)?A[key]=A[key].filter(x=>x!==item):A[key].push(item)}render()}
function go(n){A.screen=n;render()}function render(){let h='';if(A.screen===1)h=`<img class="figma-welcome" src="assets/welcome-screen.svg" alt="TrueDiet welcome screen"><button class="figma-cta" aria-label="Start assessment" onclick="go(2)"></button>`;if(A.screen===2)h=header(1)+`<section class="screen">${heading('YOUR FOCUS','What brings you\\nto TrueDiet?','Choose the goal that feels most relevant right now. You can change this later.')}<div class="list">${goals.map(([x,i])=>`<button class="option ${A.goal===x?'selected':''}" onclick="A.goal='${x}';render()"><span class="ico">${i}</span>${x}<span class="radio"></span></button>`).join('')}</div>${button('CONTINUE','go(3)')}</section>`;if(A.screen===3)h=header(2)+`<section class="screen">${heading('A LITTLE ABOUT YOU','Personal details','These details help us make your learning resources more relevant. This is not medical advice.')}<div class="seg"><button class="${A.unit==='Metric'?'selected':''}" onclick="A.unit='Metric';render()">Metric</button><button class="${A.unit==='Imperial'?'selected':''}" onclick="A.unit='Imperial';render()">Imperial</button></div><div class="fields"><div class="field"><label>Age</label><input inputmode="numeric"></div><div class="field"><label>Gender</label><input placeholder="Optional"></div></div><div class="fields"><div class="field"><label>Height</label><input inputmode="numeric"></div><div class="field"><label>Current weight</label><input inputmode="numeric"></div></div>${button('CONTINUE','go(4)')}</section>`;if(A.screen===4||A.screen===5){let isAll=A.screen===4,items=isAll?allergies:prefs,key=isAll?'allergies':'prefs',def=isAll?'None':'No specific preference';h=header(isAll?3:4)+`<section class="screen">${heading(isAll?'SAFETY FIRST':'YOUR EATING STYLE',isAll?'Food allergies &\\nintolerances':'Dietary preferences',isAll?'Tell us what you avoid so we can personalize resources thoughtfully.':'Choose the eating patterns and preferences you’d like us to consider.')}<div class="chips">${items.map(x=>`<button class="chip ${A[key].includes(x)?'selected':''}" onclick="toggle('${key}','${x}','${def}')">${A[key].includes(x)?'✓ ':''}${x}</button>`).join('')}</div><p class="help">Select all that apply. You can update these choices anytime.</p>${button('CONTINUE',isAll?'go(5)':'go(6)')}</section>`}if(A.screen===6)h=header()+`<section class="screen center build"><div class="buildicon">♡</div><div class="spinner">◌</div>${heading('ALMOST THERE','Building your\\nnutrition profile','TrueDiet is organizing evidence-based education, practical tools, and resources around your answers.')}<div class="bottom"><div class="trust">♧ Customized by Registered Dietitians</div><button class="btn" onclick="go(7)">VIEW MY PROFILE</button></div></section>`;if(A.screen===7){let med=A.goal==='Manage a Health Condition';h=header()+`<section class="screen">${heading('PERSONALIZED EDUCATION','A clearer path\\nstarts here.','Your profile guides the education and tools TrueDiet highlights for you.')}<div class="summary"><i>◎</i><div><small>Your focus</small><b>${A.goal}</b></div></div><div class="summary"><i>♧</i><div><small>Dietary preferences</small><b>${A.prefs.join(', ')}</b></div></div><div class="summary"><i>⚑</i><div><small>Allergy considerations</small><b>${A.allergies.join(', ')}</b></div></div><div class="recommend">Recommended to explore</div><div class="rec">▤ Understanding food labels <span style="margin-left:auto">›</span></div><div class="rec">⌕ Evidence behind nutrition claims <span style="margin-left:auto">›</span></div>${med?'<div class="notice">ⓘ TrueDiet provides education, not diagnosis or medical nutrition therapy. Consider a Registered Dietitian for individualized clinical care.</div>':''}${button('START OVER','go(1)')}</section>`}app.innerHTML=h}render();
</script></body></html>
<style>
.figma-hit{position:absolute;border:0;border-radius:14px;background:transparent;cursor:pointer;z-index:3;transition:.15s}
.figma-hit:hover,.figma-option-hit.selected{background:#64a82635;outline:2px solid #64a82699}
.figma-hit:active{transform:scale(.98);background:#64a82645}
.welcome-cta{left:5.83%;top:67.43%;width:88.35%;height:6.12%}
.screen-two-cta{left:4%;top:78%;width:92%;height:15%;background:#054b7020}
.figma-back-hit{left:4%;top:2.6%;width:11%;height:5%}
.figma-option-hit{left:5.83%;width:88.35%;height:5.15%}
.option-one{top:29.07%}.option-two{top:38.69%}.option-three{top:49.07%;width:27.9%}.option-four{top:49.07%;left:36.2%;width:27.7%}.option-five{top:49.07%;left:66.5%;width:27.7%}
</style>
<script>
  const existingGo = go;
  const showFigmaScreen = (asset, nextLabel, nextScreen) => {
    const isScreenTwo = asset === 'screen-2.svg';
    const overlays = isScreenTwo ? `
      <button class="figma-hit figma-back-hit" aria-label="Back" onclick="go(1)"></button>
      <button class="figma-hit figma-option-hit option-one" aria-label="Eat healthier" onclick="this.classList.toggle('selected')"></button>
      <button class="figma-hit figma-option-hit option-two" aria-label="Manage my weight" onclick="this.classList.toggle('selected')"></button>
      <button class="figma-hit figma-option-hit option-three" aria-label="Improve energy" onclick="this.classList.toggle('selected')"></button>
      <button class="figma-hit figma-option-hit option-four" aria-label="Manage a health condition" onclick="this.classList.toggle('selected')"></button>
      <button class="figma-hit figma-option-hit option-five" aria-label="Understand nutrition better" onclick="this.classList.toggle('selected')"></button>
      <button class="figma-hit figma-cta screen-two-cta" aria-label="${nextLabel}" onclick="go(${nextScreen})"></button>`
      : `<button class="figma-hit figma-cta welcome-cta" aria-label="${nextLabel}" onclick="go(${nextScreen})"></button>`;
    app.innerHTML = `<img class="figma-welcome" src="assets/${asset}" alt="TrueDiet screen">${overlays}`;
  };
  go = (n) => {
    if (n === 1) return showFigmaScreen('welcome-screen.svg', 'Start assessment', 2);
    if (n === 2) return showFigmaScreen('screen-2.svg', 'Continue assessment', 3);
    existingGo(n);
  };
  showFigmaScreen('welcome-screen.svg', 'Start assessment', 2);
</script>
